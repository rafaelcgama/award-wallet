# Alembic settings for creating new migrations during development:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "add hotel programs"
# This uses a scratch database in build/, never your real data. The app applies migrations to
# its own database by itself on launch.

[alembic]
script_location = %(here)s/src/award_wallet/migrations
sqlalchemy.url = sqlite:///%(here)s/build/alembic-scratch.db
file_template = %%(rev)s_%%(slug)s
