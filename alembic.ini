# Alembic settings for creating new migrations during development, e.g.
#   uv run alembic revision --autogenerate -m "add hotel programs"
# The database URL comes from AW_DATABASE_URL or .env (see src/award_wallet/config.py).
# The app applies migrations itself on startup, or run: uv run award-wallet migrate

[alembic]
script_location = %(here)s/src/award_wallet/migrations
file_template = %%(rev)s_%%(slug)s
