<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6bf0"/><stop offset="1" stop-color="#173f9e"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2b"/><stop offset="1" stop-color="#5e3a17"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a06a35"/><stop offset="1" stop-color="#7a4b20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred on 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- cards peeking out: airline ticket, points card, credit card -->
    <rect x="250" y="250" width="440" height="270" rx="34" fill="#f4b740" transform="rotate(-12 470 385)"/>
    <rect x="300" y="236" width="440" height="270" rx="34" fill="#e9eef7" transform="rotate(-3 520 371)"/>
    <rect x="340" y="260" width="440" height="270" rx="34" fill="#2bb673" transform="rotate(8 560 395)"/>
    <path d="M470 300 l170 -42 -64 128 -32 -54 -54 32 10 -52z" fill="#ffffff" transform="rotate(8 560 395)"/>
    <!-- wallet body -->
    <rect x="200" y="400" width="624" height="400" rx="60" fill="url(#wallet)"/>
    <path d="M200 470 q0 -70 70 -70 h484 q70 0 70 70 v20 h-624z" fill="url(#flap)"/>
    <rect x="200" y="400" width="624" height="400" rx="60" fill="none" stroke="#3f250c" stroke-opacity=".35" stroke-width="6"/>
    <!-- stitching -->
    <rect x="228" y="428" width="568" height="344" rx="40" fill="none" stroke="#e8c79a" stroke-opacity=".55" stroke-width="6" stroke-dasharray="18 14"/>
    <!-- clasp with a star (points) -->
    <rect x="610" y="530" width="214" height="150" rx="40" fill="#4a2c10"/>
    <circle cx="690" cy="605" r="44" fill="#f4b740"/>
    <path d="M690 573 l10 21 23 3 -17 16 4 23 -20 -11 -20 11 4 -23 -17 -16 23 -3z" fill="#7a4b20"/>
  </g>
</svg>
