<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Award Wallet{% endblock %}</title>
  <link rel="icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img src="/static/icon.png" alt="" width="24" height="24" class="brand-icon">Award Wallet</a>
    </div>
  </header>
  <main class="page">
    {% for item in flashes %}
    <div class="flash flash-{{ item.category }}" role="status">{{ item.message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
