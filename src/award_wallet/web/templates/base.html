<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Award Wallet{% endblock %}</title>
  <link rel="icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img src="/static/icon.png" alt="" width="24" height="24" class="brand-icon">Award Wallet</a>
      {% if user and not single_user %}
      <div class="topbar-user">
        <span class="muted">{{ user.display_name }}</span>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="button-link">Sign out</button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>
  <main class="page">
    {% for item in flashes %}
    <div class="flash flash-{{ item.category }}" role="status">{{ item.message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
