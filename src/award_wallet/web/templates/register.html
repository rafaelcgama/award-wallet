{% extends "base.html" %}
{% block title %}Create an account · Award Wallet{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Create an account</h1>
  <p class="muted">Each person gets their own account, and nobody else can see your programs.</p>
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/register" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Your name
      <input name="display_name" value="{{ display_name or '' }}" autocomplete="name" maxlength="100">
    </label>
    <label>Email
      <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required>
    </label>
    <label><span>Password <span class="muted small">(at least 10 characters)</span></span>
      <input type="password" name="password" autocomplete="new-password" minlength="10" required>
    </label>
    <button type="submit" class="button">Create account</button>
  </form>
  <p class="muted small">Already have one? <a href="/login">Sign in</a></p>
</section>
{% endblock %}
