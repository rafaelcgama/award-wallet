{% extends "base.html" %}
{% block title %}Sign in · Award Wallet{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Sign in</h1>
  <p class="muted">All your miles and points in one place.</p>
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email
      <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="button">Sign in</button>
  </form>
  {% if allow_signup %}
  <p class="muted small">New here? <a href="/register">Create an account</a></p>
  {% endif %}
</section>
{% endblock %}
