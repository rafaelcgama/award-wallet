name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checks only read the code.
permissions:
  contents: read

# Actions are pinned to exact commits, so a moved tag can't change what runs here. To
# update one, look up the new tag's commit with `git ls-remote --tags <its repo>`.
jobs:
  check:
    runs-on: ubuntu-latest
    # A stuck run stops here instead of holding a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Install Chromium for the browser tests
        # The tests that sign in to a pretend bank and read balances off pages need a real browser.
        # Without one they'd be skipped, so AW_REQUIRE_BROWSER makes a missing browser an error.
        run: |
          uv run playwright install --with-deps chromium
          path="$(uv run python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          echo "AW_BROWSER_PATH=$path" >> "$GITHUB_ENV"
          echo "AW_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"
      - name: Test
        run: uv run pytest

  windows:
    # The Windows app: the tests on Windows with its Google Chrome, then the app and its installer.
    # Setup.exe is kept with each run for 30 days, so it can be tried before merging: open the run
    # from the pull request's checks, then Summary > Artifacts.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install
        run: uv sync --locked --extra desktop
      - name: Use the runner's Google Chrome for the browser tests
        run: |
          $chrome = @("$env:ProgramFiles", "${env:ProgramFiles(x86)}") |
            ForEach-Object { Join-Path $_ "Google\Chrome\Application\chrome.exe" } |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $chrome) { throw "Google Chrome isn't installed on this runner." }
          "AW_BROWSER_PATH=$chrome" >> $env:GITHUB_ENV
          "AW_REQUIRE_BROWSER=1" >> $env:GITHUB_ENV
      - name: Test
        run: uv run pytest
      - name: Build the app and Setup.exe
        env:
          SKIP_TESTS: "1"
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Award-Wallet-Setup
          path: build/Award-Wallet-Setup.exe
          if-no-files-found: error
          retention-days: 30
