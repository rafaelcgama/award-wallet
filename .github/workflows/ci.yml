name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checks only read the code.
permissions:
  contents: read

# Actions are pinned to exact commits, so a moved tag can't change what runs here. To
# update one, look up the new tag's commit with `git ls-remote --tags <its repo>`.
jobs:
  check:
    runs-on: ubuntu-latest
    # A stuck run stops here instead of holding a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Install Chromium for the browser tests
        # The tests that sign in to a pretend bank and read balances off pages need a real browser.
        # Without one they'd be skipped, so AW_REQUIRE_BROWSER makes a missing browser an error.
        run: |
          uv run playwright install --with-deps chromium
          path="$(uv run python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          echo "AW_BROWSER_PATH=$path" >> "$GITHUB_ENV"
          echo "AW_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"
      - name: Test
        run: uv run pytest
