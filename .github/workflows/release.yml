# Merging into main publishes a release when the version in pyproject.toml is new: this builds
# the Mac app and attaches the .dmg. The installed app offers it under Check for Updates.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned to exact commits, so a moved tag can't change what runs here. To
# update one, look up the new tag's commit with `git ls-remote --tags <its repo>`.
jobs:
  dmg:
    runs-on: macos-latest
    # A stuck run stops here instead of holding a runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The build runs code from the app's libraries: it gets no way to push to the repository.
          # Only the steps that read or publish the release get the token.
          persist-credentials: false
      - name: Is this version new?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.version.outputs.new == 'true'
      - name: Build
        if: steps.version.outputs.new == 'true'
        run: bash build_dmg.sh
      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp "build/Award Wallet.dmg" "build/Award-Wallet-$TAG.dmg"
          gh release create "$TAG" "build/Award-Wallet-$TAG.dmg" --target "$GITHUB_SHA" \
            --title "Award Wallet $TAG" --generate-notes
