[project]
name = "award-wallet"
version = "0.3.1"
description = "One dashboard for all your airline miles and loyalty points."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "certifi>=2026.10.23",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
award-wallet = "award_wallet.cli:main"

[project.optional-dependencies]
desktop = [
    "playwright>=1.55",
    "pywebview>=6.2.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "playwright>=1.55",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
